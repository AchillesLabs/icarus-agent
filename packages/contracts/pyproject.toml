[project]
name = "icarus-contracts"
version = "0.1.0"
description = "Domain contracts and schemas for Icarus Agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_contracts"]
