[project]
name = "icarus-core"
version = "0.1.0"
description = "Core runtime, provider abstractions, and persistence for Icarus Agent"
requires-python = ">=3.12"
dependencies = [
    "icarus-contracts",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.14.0",
    "psycopg[binary]>=3.1.0",
]

[tool.uv.sources]
icarus-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_core"]
