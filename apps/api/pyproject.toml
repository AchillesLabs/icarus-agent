[project]
name = "icarus-api"
version = "0.1.0"
description = "Remote FastAPI service and streaming API for Icarus Agent"
requires-python = ">=3.12"
dependencies = [
    "icarus-contracts",
    "icarus-core",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
icarus-api = "icarus_api.main:main"

[tool.uv.sources]
icarus-contracts = { workspace = true }
icarus-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_api"]
