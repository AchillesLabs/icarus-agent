[project]
name = "icarus-cli"
version = "0.1.0"
description = "CLI terminal interface for Icarus Agent"
requires-python = ">=3.12"
dependencies = [
    "icarus-contracts",
    "icarus-core",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
icarus = "icarus_cli.main:app"

[tool.uv.sources]
icarus-contracts = { workspace = true }
icarus-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_cli"]
