[project]
name = "icarus-agent"
version = "0.1.0"
description = "Icarus - Modular, open-source, CLI-first AI agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.14.0",
    "psycopg[binary]>=3.1.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.1.1",
    "prompt-toolkit>=3.0.41",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.0",
]
worker = [
    "pydantic-settings>=2.2.0",
]
all = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
icarus = "icarus_cli.main:app"
icarus-api = "icarus_api.main:main"
icarus-worker = "icarus_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/contracts/src/icarus_contracts",
    "packages/agent-core/src/icarus_core",
    "apps/cli/src/icarus_cli",
    "apps/api/src/icarus_api",
    "apps/worker/src/icarus_worker",
]

[tool.hatch.build.targets.wheel.sources]
"packages/contracts/src" = ""
"packages/agent-core/src" = ""
"apps/cli/src" = ""
"apps/api/src" = ""
"apps/worker/src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "packages/contracts/src",
    "packages/agent-core/src",
    "apps/cli/src",
    "apps/api/src",
    "apps/worker/src",
    "README.md",
    "pyproject.toml",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/agent-core",
    "apps/cli",
    "apps/api",
    "apps/worker",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "packages/contracts/src",
    "packages/agent-core/src",
    "apps/cli/src",
    "apps/api/src",
    "apps/worker/src",
]
asyncio_mode = "auto"
